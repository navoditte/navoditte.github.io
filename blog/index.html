<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — navo-das</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/reviews.css">
</head>
<body>
<!--
  AGENT NOTES (not rendered). For AI coding agents maintaining this repo; visitors can ignore.

  When a new book is added to data/books.json, enrich it from Waterstones (UK edition):

  1. Search: https://www.waterstones.com/books/search/term/<title+author>. Decline cookies
     (reject non-essential). Take the top result whose URL slug matches both the title and
     the author: /book/<title-slug>/<author-slug>/<isbn13>. If nothing matches, say so and
     leave the book as is rather than guessing.
  2. Length: read the page count from that product page ("N Pages") and set "pages".
     If the owner states a page count, theirs wins. Also fill "author" and "year" if missing.
     Spine thickness is derived from pages (see spineHeight in js/reviews.js).
  3. UK cover: the jacket image is
     https://cdn.waterstones.com/bookjackets/large/<isbn[0:4]>/<isbn[4:8]>/<isbn>.jpg
     Look at it. Set "color" (6-digit hex) to the jacket's main colour. Computing it with
     dominant() from scripts/spine-colors.py is a good start, but check it against the image
     and override by eye if it picks an accent rather than the main colour.
     The "cover" field (sidebar image) comes from Open Library by default (cover id URL);
     only use the Waterstones jacket URL there if the owner has said hotlinking is fine.
  4. Never invent "rating", "read" or "review". Leave them blank if not given.
  5. Reload with a hard refresh to check; the browser caches JSON and CSS aggressively.
-->
  <div class="wrapper">
    <header class="site-header">
      <a class="brand" href="../index.html">navo-das</a>
      <nav class="site-nav">
        <a href="../index.html">Home</a>
        <a href="index.html" class="active">Books</a>
      </nav>
    </header>

    <main>
      <h1>Books</h1>
      <p class="tagline">Books I've read in the last couple of years.</p>

      <section class="charts" aria-label="Reading stats" hidden>
        <figure class="chart">
          <figcaption>Ratings</figcaption>
          <div id="chart-ratings"></div>
        </figure>
        <figure class="chart">
          <figcaption>Books per month</figcaption>
          <div id="chart-months"></div>
        </figure>
      </section>

      <div class="search">
        <input id="search" type="search" placeholder="Search title, author, genre…  ( / )" aria-label="Search books" autocomplete="off" spellcheck="false">
      </div>

      <div class="controls">
        <label for="sort">Sort</label>
        <select id="sort"></select>
        <div class="tag-menu" id="tag-menu" hidden>
          <button type="button" class="tag-btn" id="tag-btn" aria-haspopup="true" aria-expanded="false" aria-controls="tag-panel">
            Genre<span class="hide-sm"> / theme</span> <span class="tag-badge" id="tag-badge"></span> <span aria-hidden="true">▾</span>
          </button>
          <div class="tag-panel" id="tag-panel" hidden role="group" aria-label="Filter by genre or theme (books must have all selected)">
            <div class="tag-panel-head">
              <span>Must have all selected</span>
              <button type="button" class="tag-clear" id="tag-clear" hidden>Clear</button>
            </div>
            <div class="tag-list" id="tag-list"></div>
          </div>
        </div>
        <div class="view-toggle" id="views" role="group" aria-label="View">
          <button type="button" data-view="shelf" aria-pressed="true">Shelf</button>
          <button type="button" data-view="list" aria-pressed="false">List</button>
        </div>
      </div>
      <p class="count" id="count" aria-live="polite"></p>

      <div id="shelf" class="shelf"></div>
      <noscript><p class="empty-state">The shelf needs JavaScript. The raw list lives in <a href="../data/books.json">books.json</a>.</p></noscript>
    </main>

    <div class="backdrop" id="backdrop"></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true" inert>
      <button type="button" class="panel-close" id="panel-close" aria-label="Close review">&times;</button>
      <div id="panel-body"></div>
    </aside>

    <footer class="site-footer">
      &copy; 2026 navoditte
      <p class="footer-note">inspired by <a href="https://press.stripe.com/" target="_blank" rel="noopener">Stripe Press</a></p>
    </footer>
  </div>

  <script src="../js/reviews.js" defer></script>
  <script src="../js/leaf.js" defer></script>
</body>
</html>
